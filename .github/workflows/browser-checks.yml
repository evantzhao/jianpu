name: Browser checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Mobile and desktop (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-screenshots-${{ matrix.engine }}
          path: /tmp/guqin-qa/${{ matrix.engine }}/
          retention-days: 14
